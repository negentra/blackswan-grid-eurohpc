name: synthetic-cpu-reproducibility
on:
  push:
  pull_request:
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned CPU fixture
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy==2.4.6
          python -m pip install --no-deps -e .
      - name: Tests and publication manifest
        run: |
          python -m unittest discover -s tests -v
          python tools/check_public.py verify
      - name: Small CPU smoke
        run: python -m benchmarks.connected_grid_calibration --scale S1 --steps 2 --device cpu --output /tmp/connected-grid-smoke.json
