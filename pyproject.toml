[build-system]
requires = ["setuptools>=70,<85", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackswan-grid-eurohpc-fixture"
version = "0.1.0"
description = "Sanitized connected-grid temporal compute fixture"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["torch==2.8.0", "numpy==2.4.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["benchmarks*"]
